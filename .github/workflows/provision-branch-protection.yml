name: Provision Branch Protection (manual)

on:
  workflow_dispatch: {}

jobs:
  protect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      administration: write
    steps:
      - name: Check inputs
        run: |
          if [ -z "${{ secrets.REPO_ADMIN_TOKEN }}" ]; then
            echo "Set the repository secret REPO_ADMIN_TOKEN with a PAT that has admin:repo scope";
            exit 1;
          fi

      - name: Apply branch protection to main
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          echo "Applying branch protection to ${REPO} main"
          curl -s -X PUT \
            -H "Authorization: token ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${REPO}/branches/main/protection \
            -d '{
              "required_status_checks": {"strict": true, "contexts": ["CI — tests & security"]},
              "enforce_admins": true,
              "required_pull_request_reviews": {"required_approving_review_count": 1},
              "restrictions": null
            }' | jq .
